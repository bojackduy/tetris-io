[package]
name = "tetris-io"
description = "Terminal-based Tetris game built with Ratatui and Crossterm"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Duyyy123/tetris-io"
authors = ["Duyyy123"]
keywords = ["tetris", "terminal", "tui", "ratatui", "game"]
categories = ["games", "command-line-interface"]

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
