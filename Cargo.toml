[workspace]
members = [
    "crates/tetris-domain",
    "crates/tetris-application",
    "crates/tetris-adapter-net-tcp",
    "crates/tetris-adapter-tui",
    "crates/tetris-adapter-storage-sqlite",
]

[package]
name = "rust-ratatui"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
rand = "0.8"
tetris-adapter-net-tcp = { path = "crates/tetris-adapter-net-tcp" }
tetris-adapter-storage-sqlite = { path = "crates/tetris-adapter-storage-sqlite" }
tetris-adapter-tui = { path = "crates/tetris-adapter-tui" }
tetris-application = { path = "crates/tetris-application" }
tetris-domain = { path = "crates/tetris-domain" }
