project:
  name: tetris-io
  version: 0.2.2
  description: Terminal-based Tetris game
  longDescription: |
    A modern Tetris implementation in Rust featuring SRS rotation,
    multiple game modes, and a clean terminal UI.
  license: MIT
  authors:
    - bojackduy
  copyright: Copyright (c) 2026 bojackduy
  links:
    homepage: https://github.com/bojackduy/tetris-io

release:
  github:
    owner: bojackduy
    name: tetris-io
    overwrite: true
    milestone:
      close: false

distributions:
  tetris-io:
    type: BINARY
    artifacts:
      - path: dist/tetris-io-linux-x86_64.tar.gz
        platform: linux-x86_64
      - path: dist/tetris-io-linux-aarch64.tar.gz
        platform: linux-aarch_64
      - path: dist/tetris-io-osx-x86_64.tar.gz
        platform: osx-x86_64
      - path: dist/tetris-io-osx-aarch64.tar.gz
        platform: osx-aarch_64
      - path: dist/tetris-io-windows-x86_64.zip
        platform: windows-x86_64
