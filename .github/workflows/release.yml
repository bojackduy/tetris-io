name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  issues: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: osx-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: osx-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Install cross compile dependencies
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set cross compiler
        if: matrix.cross
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create artifact
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/tetris-io.exe dist/
            cd dist && powershell -Command "Compress-Archive -Path * -DestinationPath ../tetris-io-${{ matrix.platform }}.zip"
          else
            cp target/${{ matrix.target }}/release/tetris-io dist/
            tar -czf tetris-io-${{ matrix.platform }}.tar.gz -C dist .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: tetris-io-${{ matrix.platform }}.*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Run JReleaser full-release
        uses: jreleaser/release-action@v2
        with:
          arguments: full-release -PartifactsDir=dist -PskipArchiveResolver
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Setup npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Create npm packages
        run: |
          set -euo pipefail

          mkdir -p npm-packages

          cat > npm-packages/launcher.js << 'EOF'
          #!/usr/bin/env node
          const { spawnSync } = require('node:child_process');
          const path = require('node:path');

          const map = {
            'linux:x64': '@bojackduy/tetris-io-linux-x64',
            'linux:arm64': '@bojackduy/tetris-io-linux-arm64',
            'darwin:x64': '@bojackduy/tetris-io-darwin-x64',
            'darwin:arm64': '@bojackduy/tetris-io-darwin-arm64',
            'win32:x64': '@bojackduy/tetris-io-win32-x64'
          };

          const key = `${process.platform}:${process.arch}`;
          const pkg = map[key];

          if (!pkg) {
            console.error(`Unsupported platform: ${key}`);
            process.exit(1);
          }

          let pkgJson;
          try {
            pkgJson = require.resolve(`${pkg}/package.json`);
          } catch {
            console.error(`Missing platform package ${pkg}. Reinstall package.`);
            process.exit(1);
          }

          const binName = process.platform === 'win32' ? 'tetris-io.exe' : 'tetris-io';
          const binPath = path.join(path.dirname(pkgJson), 'bin', binName);
          const result = spawnSync(binPath, process.argv.slice(2), { stdio: 'inherit' });
          process.exit(result.status ?? 1);
          EOF

          make_platform_pkg() {
            name="$1"
            os="$2"
            cpu="$3"
            archive="$4"
            ext="$5"

            dir="npm-packages/${name}"
            mkdir -p "${dir}/bin"

            if [[ "${ext}" == "zip" ]]; then
              unzip -qo "dist/${archive}" -d "${dir}/bin"
            else
              tar -xzf "dist/${archive}" -C "${dir}/bin"
            fi

            if [[ "${os}" != "win32" ]]; then
              chmod +x "${dir}/bin/tetris-io"
            fi

            cat > "${dir}/package.json" << EOF
          {
            "name": "@bojackduy/${name}",
            "version": "$VERSION",
            "description": "Platform binary for tetris-io",
            "license": "MIT",
            "os": ["${os}"],
            "cpu": ["${cpu}"],
            "bin": {
              "tetris-io": "bin/tetris-io${ext:+${ext/zip/.exe}}"
            }
          }
          EOF
          }

          make_platform_pkg "tetris-io-linux-x64" "linux" "x64" "tetris-io-linux-x86_64.tar.gz" ""
          make_platform_pkg "tetris-io-linux-arm64" "linux" "arm64" "tetris-io-linux-aarch64.tar.gz" ""
          make_platform_pkg "tetris-io-darwin-x64" "darwin" "x64" "tetris-io-osx-x86_64.tar.gz" ""
          make_platform_pkg "tetris-io-darwin-arm64" "darwin" "arm64" "tetris-io-osx-aarch64.tar.gz" ""
          make_platform_pkg "tetris-io-win32-x64" "win32" "x64" "tetris-io-windows-x86_64.zip" "zip"

          mkdir -p npm-packages/tetris-io/bin
          cp npm-packages/launcher.js npm-packages/tetris-io/bin/tetris-io.js

          cat > npm-packages/tetris-io/package.json << EOF
          {
            "name": "@bojackduy/tetris-io",
            "version": "$VERSION",
            "description": "Terminal-based Tetris game",
            "bin": {
              "tetris-io": "bin/tetris-io.js"
            },
            "repository": {
              "type": "git",
              "url": "https://github.com/Duyyy123/tetris-io"
            },
            "keywords": ["tetris", "game", "cli"],
            "license": "MIT",
            "optionalDependencies": {
              "@bojackduy/tetris-io-linux-x64": "$VERSION",
              "@bojackduy/tetris-io-linux-arm64": "$VERSION",
              "@bojackduy/tetris-io-darwin-x64": "$VERSION",
              "@bojackduy/tetris-io-darwin-arm64": "$VERSION",
              "@bojackduy/tetris-io-win32-x64": "$VERSION"
            }
          }
          EOF

          chmod +x npm-packages/tetris-io/bin/tetris-io.js
          find npm-packages -maxdepth 2 -type f -name package.json -print

      - name: Publish platform packages to npm
        run: |
          set -euo pipefail
          for pkg in tetris-io-linux-x64 tetris-io-linux-arm64 tetris-io-darwin-x64 tetris-io-darwin-arm64 tetris-io-win32-x64; do
            npm publish --access public "npm-packages/${pkg}"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main npm package
        run: npm publish --access public npm-packages/tetris-io
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
