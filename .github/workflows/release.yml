name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  issues: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: osx-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: osx-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Install cross compile dependencies
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set cross compiler
        if: matrix.cross
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create artifact
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/tetris-io.exe dist/
            cd dist && powershell -Command "Compress-Archive -Path * -DestinationPath ../tetris-io-${{ matrix.platform }}.zip"
          else
            cp target/${{ matrix.target }}/release/tetris-io dist/
            tar -czf tetris-io-${{ matrix.platform }}.tar.gz -C dist .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: tetris-io-${{ matrix.platform }}.*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Run JReleaser full-release
        uses: jreleaser/release-action@v2
        with:
          arguments: full-release -PartifactsDir=dist -PskipArchiveResolver
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            PKGID="$(cargo pkgid)"
            echo "VERSION=${PKGID##*@}" >> $GITHUB_ENV
          fi

      - name: Setup npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Create npm package
        run: |
          mkdir -p npm-package
          
          cat > npm-package/package.json << EOF
          {
            "name": "@bojackduy/tetris-io",
            "version": "$VERSION",
            "description": "Terminal-based Tetris game",
            "bin": {
              "tetris-io": "./tetris-io"
            },
            "repository": {
              "type": "git",
              "url": "https://github.com/Duyyy123/tetris-io"
            },
            "keywords": ["tetris", "game", "cli"],
            "license": "MIT"
          }
          EOF
          
          # Extract linux binary
          tar -xzf dist/tetris-io-linux-x86_64.tar.gz -C npm-package
          
          ls -la npm-package/

      - name: Publish to npm
        working-directory: npm-package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
