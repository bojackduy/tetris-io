name: Publish to crates.io

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Run tests before publishing
      - name: Run tests
        run: cargo test --workspace

      # Publish crates in dependency order (leaves first, root last).
      # Each step waits a bit for crates.io index to update.
      - name: Publish tetris-domain
        run: cargo publish -p tetris-domain --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index
        run: sleep 30

      - name: Publish tetris-application
        run: cargo publish -p tetris-application --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index
        run: sleep 30

      - name: Publish tetris-adapter-tui
        run: cargo publish -p tetris-adapter-tui --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish tetris-adapter-storage-sqlite
        run: cargo publish -p tetris-adapter-storage-sqlite --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish tetris-adapter-net-tcp
        run: cargo publish -p tetris-adapter-net-tcp --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index
        run: sleep 30

      - name: Publish rust-ratatui
        run: cargo publish -p rust-ratatui --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index
        run: sleep 30

      - name: Publish tetris-bin
        run: cargo publish -p tetris-bin --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
